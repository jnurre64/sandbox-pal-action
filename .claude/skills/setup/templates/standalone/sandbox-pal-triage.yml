name: "Claude Agent: Triage"
run-name: "${{ github.event.label.name }} on #${{ github.event.issue.number }} by ${{ github.actor }}"

on:
  issues:
    types: [labeled]

concurrency:
  group: sandbox-pal-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage-issue:
    if: >-
      github.event.label.name == 'agent' &&
      github.actor != '{{BOT_USER}}'
    runs-on: [self-hosted, agent]
    timeout-minutes: 125
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run agent dispatch
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          AGENT_CONFIG: ${{ github.workspace }}/.sandbox-pal-dispatch/config.env  # override file (gitignored, optional)
        run: |
          .sandbox-pal-dispatch/scripts/sandbox-pal-dispatch.sh \
            new_issue \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}"

  # Breadcrumb: label events from the bot account are filtered by the
  # anti-self-trigger guard above. Leave a comment explaining the skip so
  # programmatic callers aren't debugging silence — they should use
  # repository_dispatch (see "Agent Dispatch (programmatic)").
  actor-filter-notice:
    if: >-
      github.event.label.name == 'agent' &&
      github.actor == '{{BOT_USER}}'
    runs-on: [self-hosted, agent]
    # A courtesy comment must never turn the run red.
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - name: Explain the skipped label trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NOTICE: 'The `agent` label was applied by the bot account (`{{BOT_USER}}`), so the label-triggered agent workflow was intentionally skipped (anti-self-trigger guard). Automation running as the bot should trigger via `repository_dispatch` instead — see https://github.com/jnurre64/sandbox-pal-action/blob/main/docs/architecture.md#programmatic-triggering-repository_dispatch'
        run: |
          # curl, not gh: a self-hosted runner may not have gh on its PATH.
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"
          marker='<!-- sandbox-pal:actor-filter-notice -->'
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          # Once per issue: an orchestrator edits labels on every gate.
          existing=$(curl -fsS "${auth[@]}" "${api}?per_page=100" || true)
          if grep -qF "$marker" <<< "$existing"; then
            echo "Notice already posted on this issue; not repeating it."
            exit 0
          fi
          jq -n --arg body "${marker}"$'\n'"${NOTICE}" '{body: $body}' \
            | curl -fsS -X POST "${auth[@]}" "$api" -d @- > /dev/null
