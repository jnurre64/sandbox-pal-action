name: "Claude Agent: Direct Implement"
run-name: "${{ github.event.label.name }} on #${{ github.event.issue.number }} by ${{ github.actor }}"

on:
  issues:
    types: [labeled]

jobs:
  direct-implement:
    if: >-
      github.event.label.name == 'agent:implement' &&
      github.actor != '{{BOT_USER}}'
    uses: jnurre64/sandbox-pal-action/.github/workflows/sandbox-pal-direct-implement.yml@v1
    with:
      bot_user: "{{BOT_USER}}"
    secrets:
      agent_pat: ${{ secrets.AGENT_PAT }}

  # Breadcrumb: label events from the bot account are filtered by the
  # anti-self-trigger guard above. Leave a comment explaining the skip so
  # programmatic callers aren't debugging silence. Direct implement has no
  # repository_dispatch event type — the label must come from a human account.
  actor-filter-notice:
    if: >-
      github.event.label.name == 'agent:implement' &&
      github.actor == '{{BOT_USER}}'
    runs-on: [self-hosted, agent]
    # A courtesy comment must never turn the run red.
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - name: Explain the skipped label trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NOTICE: 'The `agent:implement` label was applied by the bot account (`{{BOT_USER}}`), so the label-triggered agent workflow was intentionally skipped (anti-self-trigger guard). This trigger has no `repository_dispatch` event type — re-apply the label from a human account. Details: https://github.com/jnurre64/sandbox-pal-action/blob/main/docs/architecture.md#programmatic-triggering-repository_dispatch'
        run: |
          # curl, not gh: a self-hosted runner may not have gh on its PATH.
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"
          marker='<!-- sandbox-pal:actor-filter-notice -->'
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          # Once per issue: an orchestrator edits labels on every gate.
          existing=$(curl -fsS "${auth[@]}" "${api}?per_page=100" || true)
          if grep -qF "$marker" <<< "$existing"; then
            echo "Notice already posted on this issue; not repeating it."
            exit 0
          fi
          jq -n --arg body "${marker}"$'\n'"${NOTICE}" '{body: $body}' \
            | curl -fsS -X POST "${auth[@]}" "$api" -d @- > /dev/null
