name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on scripts
        run: |
          shellcheck scripts/sandbox-pal-dispatch.sh
          shellcheck scripts/cleanup.sh
          shellcheck scripts/lib/*.sh
          shellcheck scripts/check-prereqs.sh
          shellcheck scripts/create-labels.sh
          shellcheck scripts/agent-profile.sh
          shellcheck scripts/setup.sh
          shellcheck scripts/update.sh

  bats:
    name: BATS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install worker validation dependencies
        run: python3 -m pip install -r scripts/requirements-worker.txt

      - name: Run BATS tests
        run: ./tests/bats/bin/bats tests/
